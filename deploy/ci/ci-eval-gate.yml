name: Eval-Gated CI/CD Pipeline (12-Gate Verification & Cloud Run Build)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-eval-gates:
    name: Pytest Suite & 12-Gate Enterprise Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run 32-Test Pytest Suite
        run: |
          python -m pytest tests/test_suite.py -v --tb=short

      - name: Run 12-Gate Automated Evaluation Harness
        run: |
          python -c "
          import json, sys
          from src.evals.runner import run_twelve_gate_evaluation
          report = run_twelve_gate_evaluation()
          print(json.dumps(report, indent=2))
          if not report['all_gates_passed']:
              sys.exit(1)
          "

  container-build-verify:
    name: Verify Multi-Stage Hardened Cloud Run Container
    runs-on: ubuntu-latest
    needs: test-and-eval-gates

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image (Dry-Run Verification)
        run: |
          docker build -t google-cloud-agentic-architect-suite:ci-verify .
