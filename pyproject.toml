[project]
name = "google-cloud-agentic-architect-suite"
version = "1.0.0"
description = "Google Cloud Professional Agentic Architect: Securing, Governing, and Orchestrating Enterprise Agentic Workflows on GCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
